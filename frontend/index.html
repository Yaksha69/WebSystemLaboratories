<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../frontend/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary  " data-bs-theme="dark">
            <div class="container-fluid">
              <a class="navbar-brand text-danger" href="#">Destroy</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                  </li>
                </ul> 
              </div>
            </div>
          </nav>

    </header>
    <section>
        <div class="ms-5 mt-5"> The Song List</div>
        
        <div class="inventorytable mt-3">
            <div class="col-8 d-flex justify-content-end align-items-center">
                <input type="text" id="searchBar" class="form-control me-3 w-50" placeholder="Search songs" />
                <button class="btn btn-outline-dark btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="fa fa-plus me-2"></i> Add Songs
                </button>
            </div>
            <table class="table mt-2 table-striped table-bordered border-dark table-hover">
                <thead class="table-dark">
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Artist</th>
                    <th scope="col">Albums</th>
                    <th scope="col">Date</th>
                    <th class="colsad" style="width: 10%" scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                    <td>2020</td>
                    <td>
                        <button type="button" class="btn border-dark btn-secondary" data-bs-toggle="modal" data-bs-target="#editModal">
                            <i class="bi bi-pen"></i>
                          </button>
                        <button class="btn border-dark btn-danger"><i class="bi bi-trash-fill"></i></button>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">2</th>
                    <td>Jacob</td>
                    <td>Thornton</td>
                    <td>@fat</td>
                    <td>2019</td>
                    <td>
                        <button type="button" class="btn border-dark btn-secondary" data-bs-toggle="modal" data-bs-target="#editModal">
                            <i class="bi bi-pen"></i>
                          </button>
                        <button class="btn border-dark btn-danger"><i class="bi bi-trash-fill"></i></button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <nav aria-label="Page navigation example">
                <ul class="pagination d-flex justify-content-center align-items-center">
                  <li class="page-item ">
                    <a class="page-link" href="#" aria-label="Previous">
                      <span aria-hidden="true">&laquo;</span>
                    </a>
                  </li>
                  <li class="page-item"><a class="page-link" href="#">1</a></li>
                  <li class="page-item"><a class="page-link" href="#">2</a></li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item">
                    <a class="page-link" href="#" aria-label="Next">
                      <span aria-hidden="true">&raquo;</span>
                    </a>
                  </li>
                </ul>
              </nav>
        </div>
        

        <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form id="addProductForm" enctype="multipart/form-data">
                    <div class="modal-content">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="Name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="Name" required>
                            </div>
                            <div class="mb-3">
                                <label for="Artist" class="form-label">Artist</label>
                                <input type="text" class="form-control" id="Artist" required>
                            </div>
                            <div class="mb-3">
                                <label for="Albums" class="form-label">Albums</label>
                                <input type="text" class="form-control" id="Albums" required>
                            </div>
                            <div class="mb-3">
                                <label for="Date" class="form-label">Date</label>
                                <input type="number" class="form-control" id="Date" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Add Product</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="Name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="Name" required>
                    </div>
                    <div class="mb-3">
                        <label for="Artist" class="form-label">Artist</label>
                        <input type="text" class="form-control" id="Artist" required>
                    </div>
                    <div class="mb-3">
                        <label for="Albums" class="form-label">Albums</label>
                        <input type="text" class="form-control" id="Albums" required>
                    </div>
                    <div class="mb-3">
                        <label for="Date" class="form-label">Date</label>
                        <input type="number" class="form-control" id="Date" required>
                    </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-primary">Save changes</button>
                </div>
              </div>
            </div>
          </div>
        
    </section>
    <script src="index.js"></script>
</body>
</html>
